name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same major/minor as Unreal Engine 5.6's embedded Python
      - name: Qt runtime libraries (offscreen rendering)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Python dependencies
        run: python -m pip install "PySide6-Essentials>=6.5,<6.12" pyflakes   # 6.12.0 frees None on Python 3.11 (see QT_SPEC)
      - name: Run tests (static checks + mock-engine tests)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_all.py
